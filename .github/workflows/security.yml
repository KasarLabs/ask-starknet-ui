# Security Audit Workflow
# This workflow runs security audits on every push and PR, plus scheduled daily scans
# It helps detect vulnerabilities like CVE-2025-55182 (React2Shell) early

name: Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 6:00 AM UTC to catch newly disclosed vulnerabilities
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Run pnpm audit (JSON output for processing)
        id: audit
        run: |
          pnpm audit --json > audit-results.json 2>&1 || true
          echo "audit_output<<EOF" >> $GITHUB_OUTPUT
          cat audit-results.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check for critical vulnerabilities
        run: |
          if pnpm audit --audit-level=critical 2>&1 | grep -q "critical"; then
            echo "::error::Critical vulnerabilities found! Immediate action required."
            exit 1
          fi

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-results
          path: audit-results.json
          retention-days: 30

  # Check for known CVEs in dependencies using osv-scanner
  osv-scan:
    name: OSV Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OSV Scanner
        uses: google/osv-scanner-action@v2
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --format=json
            --output=osv-results.json
        continue-on-error: true

      - name: Upload OSV scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osv-scan-results
          path: osv-results.json
          retention-days: 30

  # Check for outdated packages that might have security patches
  outdated-check:
    name: Check Outdated Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check outdated packages
        run: |
          echo "## Outdated Packages Report" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          pnpm outdated 2>&1 | tee outdated.txt || true
          cat outdated.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Check critical packages versions
        run: |
          # Check Next.js version for known vulnerabilities
          NEXT_VERSION=$(node -p "require('./package.json').dependencies.next")
          echo "Current Next.js version: $NEXT_VERSION"
          
          # Check React version
          REACT_VERSION=$(node -p "require('./package.json').dependencies.react")
          echo "Current React version: $REACT_VERSION"
          
          echo "## Critical Package Versions" >> $GITHUB_STEP_SUMMARY
          echo "- Next.js: $NEXT_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- React: $REACT_VERSION" >> $GITHUB_STEP_SUMMARY

  # CodeQL analysis for code security
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  # Notify on vulnerabilities found (only on scheduled runs)
  notify:
    name: Notify on Vulnerabilities
    runs-on: ubuntu-latest
    needs: [dependency-audit, osv-scan]
    if: failure() && github.event_name == 'schedule'
    steps:
      - name: Create Issue for Vulnerabilities
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Security Alert: Vulnerabilities detected in dependencies`;
            const body = `
            ## Security Scan Results
            
            The scheduled security scan has detected potential vulnerabilities in project dependencies.
            
            **Action Required:**
            1. Review the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            2. Check the security audit artifacts for detailed information
            3. Update affected packages immediately if critical vulnerabilities are found
            
            **Common fixes:**
            - Run \`pnpm audit fix\` to automatically fix compatible vulnerabilities
            - Manually update packages with \`pnpm update <package-name>\`
            - Check for security advisories at https://github.com/advisories
            
            ---
            *This issue was automatically created by the security audit workflow.*
            `;
            
            // Check if similar issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security'
            });
            
            const existingIssue = issues.data.find(i => i.title.includes('Security Alert'));
            
            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'dependencies', 'high-priority']
              });
            }

